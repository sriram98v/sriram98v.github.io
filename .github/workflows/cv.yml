name: Validate CV
on:
  push:
    paths:
      - 'static/docs/Academic_CV.typ'
      - '.github/workflows/cv.yml'
  pull_request:
    paths:
      - 'static/docs/Academic_CV.typ'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Compile CV
        uses: lvignoli/typst-action@main
        with:
          source_file: static/docs/Academic_CV.typ
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: Academic_CV
          path: static/docs/Academic_CV.pdf
          if-no-files-found: error
